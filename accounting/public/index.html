<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>الحسابات – الطاقة الوطنية</title>
<style>
:root{--dk:#0f3d2e;--dk2:#16533f;--lime:#8cc63f;--bg:#f3f6f4;--card:#fff;--ink:#1c2b25;--mut:#6b7c74;--line:#e2e9e5;--red:#c0392b;--amber:#c98a12;--blue:#1f6fb2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif}
a{color:var(--dk2)}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
#app{display:flex;min-height:100vh}
#side{width:250px;background:var(--dk);color:#e8f1ec;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
#side .brand{padding:16px 16px 10px;border-bottom:1px solid rgba(255,255,255,.1)}
#side .brand b{display:block;font-size:16px}#side .brand small{opacity:.7;font-size:12px}
#side nav{padding:6px 0 30px}
#side h4{margin:14px 16px 4px;font-size:12px;opacity:.55;font-weight:600}
#side a{display:block;color:#e8f1ec;text-decoration:none;padding:7px 18px;font-size:14px;border-right:3px solid transparent}
#side a:hover{background:rgba(255,255,255,.06)}
#side a.on{background:rgba(140,198,63,.16);border-right-color:var(--lime);color:#fff;font-weight:600}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
table.lines select.lr{width:100%;margin-bottom:4px;padding:4px 6px;font-size:13px}
#gs{flex:0 1 320px;min-width:140px}#gs input{width:100%;border:1px solid var(--line);border-radius:20px;padding:7px 14px;background:var(--bg)}
#menuBtn{display:none}
#view{padding:18px;max-width:1300px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:16px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#b8c8bf}
.btn.pri{background:var(--dk);border-color:var(--dk);color:#fff}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#0b2a1f;font-weight:600}
.btn.red{color:var(--red);border-color:#efc4be}
.btn.sm{padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:3px;min-width:150px;flex:1}
.f.s{flex:0 0 140px;min-width:120px}
.f label{font-size:12.5px;color:var(--mut)}
input,select,textarea{border:1px solid #cfdad4;border-radius:8px;padding:7px 9px;background:#fff;width:100%;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(140,198,63,.45);border-color:var(--lime)}
textarea{min-height:60px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{background:#f5f8f6;font-weight:600;font-size:13px;color:#33463d;position:sticky;top:0}
td.n,th.n{text-align:left;direction:ltr;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:#f8fbf9}
tr.void td{color:#9aa;text-decoration:line-through}
tr.tot td{font-weight:700;background:#f5f8f6}
tr.g td{font-weight:600;background:#fbfcfb}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;background:#eef3f0;color:#33463d}
.pill.ok{background:#e4f4d6;color:#2d6a0f}.pill.bad{background:#fbe3df;color:var(--red)}.pill.warn{background:#fff1d6;color:#8a5a00}.pill.blue{background:#e3eefa;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi small{color:var(--mut)}.kpi b{display:block;font-size:20px;direction:ltr;text-align:right;margin-top:2px}
.kpi.dk{background:var(--dk);color:#fff;border-color:var(--dk)}.kpi.dk small{color:#cfe3d8}
.bars{display:flex;gap:8px;align-items:flex-end;height:170px;padding-top:10px}
.bars .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut)}
.bars .bb{display:flex;gap:2px;align-items:flex-end;height:140px}
.bars .bb i{width:12px;border-radius:3px 3px 0 0;display:block}
.mut{color:var(--mut)}.red{color:var(--red)}.grn{color:#2d6a0f}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.toolbar .sp{flex:1}
.lines td{padding:4px}.lines input,.lines select{padding:5px 6px}
.lines .del{color:var(--red);border:0;background:none;cursor:pointer;font-size:18px}
.sum{margin-top:10px;display:grid;grid-template-columns:auto 160px;gap:4px 14px;justify-content:end;align-items:center}
.sum b{direction:ltr;text-align:left}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#16241e;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.ov{position:fixed;inset:0;background:rgba(5,25,15,.5);display:grid;place-items:center;z-index:50;padding:14px}
.dlg{background:#fff;border-radius:14px;padding:18px;width:min(560px,100%);max-height:90vh;overflow:auto}
.dlg h3{margin-top:0}
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--dk),#0a2a20)}
.login .box{background:#fff;border-radius:16px;padding:26px;width:min(400px,100%)}
.login h2{margin:0 0 4px;color:var(--dk)}
.tree td:first-child{white-space:nowrap}
.chk{display:flex;gap:14px;flex-wrap:wrap}
.warnbox{background:#fff6e5;border:1px solid #f2d79b;border-radius:8px;padding:8px 12px;color:#7a5200}
.okbox{background:#eef8e6;border:1px solid #cfe8b8;border-radius:8px;padding:8px 12px;color:#2d6a0f}
@media (max-width:900px){
  #side{position:fixed;right:0;z-index:40;transform:translateX(100%);transition:.2s;box-shadow:0 0 30px rgba(0,0,0,.3)}
  #side.open{transform:none}
  #menuBtn{display:inline-flex}
  #view{padding:12px}
  .f{min-width:130px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:8px}.kpi{padding:10px}.kpi b{font-size:16px}
  #who{display:none}
}
/* الطباعة */
#print{display:none}
@media print{
  body{background:#fff}
  #app,#toast,.ov{display:none!important}
  #print{display:flex;flex-direction:column;min-height:272mm;padding:0 2mm;color:#000;font-size:13px}
  #print .tw{max-height:none;overflow:visible;border:0}#print th{position:static}#print .btn{display:none}#print .card{border:0;padding:0}#print tr.click{cursor:default}
  @page{size:A4;margin:12mm 10mm}
}
.ph{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--dk);padding-bottom:8px;margin-bottom:12px}
.ph .co b{font-size:17px;color:var(--dk)}.ph .co small{display:block;color:#555}
.ph .ti{text-align:left}.ph .ti b{font-size:20px;color:var(--dk)}
.pt{width:100%;border-collapse:collapse;margin:8px 0}.pt th,.pt td{border:1px solid #bbb;padding:5px 7px}.pt th{background:#eef3f0}
.psig{display:flex;justify-content:space-between;margin-top:40px}.psig div{text-align:center;width:30%;border-top:1px solid #777;padding-top:4px}
/* محرّر ما قبل الطباعة */
#pe{position:fixed;inset:0;z-index:60;background:#5d6b65;display:flex;flex-direction:row-reverse}
#pe .pe-side{width:300px;flex-shrink:0;background:#fff;overflow:auto;padding:14px;border-right:1px solid var(--line)}
#pe .pe-side h3{margin:0 0 4px;font-size:17px}
#pe .pe-side h4{margin:14px 0 6px;font-size:13px;color:var(--mut)}
#pe .pe-side label{display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:14px;cursor:pointer}
#pe .pe-side label input{width:auto}
#pe .pe-side select{width:100%;padding:6px;border:1px solid var(--line);border-radius:8px}
#pe .pe-hint{font-size:12px;color:var(--mut);margin:0 0 8px}
#pe .pe-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;position:sticky;bottom:-14px;background:#fff;padding:10px 0}
#pe .pe-wrap{flex:1;overflow:auto;padding:24px}
#pe .pe-page{background:#fff;color:#000;max-width:210mm;min-height:297mm;display:flex;flex-direction:column;margin:0 auto;padding:12mm 10mm;box-shadow:0 4px 30px rgba(0,0,0,.35);font-size:13px;outline:none}
#pe .pe-page.land{max-width:297mm;min-height:210mm}
#pe .pe-page [contenteditable],#pe .pe-page:focus-within{outline:none}
#pe .pe-page td:hover,#pe .pe-page p:hover{background:#fffbe6}
#pe .pe-page .tw{max-height:none;overflow:visible;border:0}#pe .pe-page th{position:static}#pe .pe-page .btn{display:none}#pe .pe-page .card{border:0;padding:0}
#pe .pe-tbl{border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:8px}
#pe .pe-tbl b{font-size:12px;color:var(--mut)}
.pe-mv{float:left;font-weight:inherit;margin-inline-start:12px}
@media (max-width:900px){#pe{flex-direction:column}#pe .pe-side{width:auto;max-height:45vh;border-right:0;border-bottom:1px solid var(--line)}#pe .pe-wrap{padding:10px}#pe .pe-page{padding:6mm 5mm;min-height:0}}
@media print{#pe{display:none!important}}
.pfoot{margin-top:auto;border-top:1px solid #ccc;padding-top:6px;font-size:11px;color:#666;text-align:center}.pfoot .pcontact{font-size:13px;color:#000;margin-bottom:3px}
.pdoc{flex:0 0 auto}.pdoc .psig{margin-top:46px}
.pt th.w-no{width:6%}.pt th.w-q{width:11%}.pt th.w-u{width:12%}.pt th.w-p{width:15%}.pt th.w-t{width:17%}.pt td{vertical-align:top}.pt tr{page-break-inside:avoid}
</style>
</head>
<body>
<div id="app" class="hidden">
  <aside id="side"><div class="brand"><b>الحسابات</b><small id="coName"></small></div><nav id="nav"></nav></aside>
  <div id="main">
    <header><button class="btn sm" id="menuBtn">☰</button><h1 id="title"></h1><form id="gs" onsubmit="event.preventDefault();const v=$('#gsQ').value.trim();if(v.length>1)go('#/search/'+encodeURIComponent(v))"><input id="gsQ" type="search" placeholder="🔍 بحث: فاتورة، زبون، مورد…" autocomplete="off"></form><span class="mut" id="who"></span><button class="btn sm" onclick="go('#/password')">كلمة المرور</button><button class="btn sm" onclick="logout()">خروج</button></header>
    <div id="view"></div>
  </div>
</div>
<div id="auth"></div>
<div id="print"></div>
<div id="toast"></div>
<script>
'use strict';
/* ================= أساسيات ================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get:(k,d)=>{try{const v=localStorage.getItem('acc.'+k);return v==null?d:JSON.parse(v)}catch(_){return d}},set:(k,v)=>{try{localStorage.setItem('acc.'+k,JSON.stringify(v))}catch(_){}},del:k=>{try{localStorage.removeItem('acc.'+k)}catch(_){}}};
let TOKEN=LS.get('token',null),M=null;
const CUR={IQD:'د.ع',USD:'$'};
function num(v,d){v=Number(v)||0;if(d==null)d=Math.abs(v%1)>0.004?2:0;return v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
const money=(v,c)=>num(v,c==='USD'?2:0)+' '+(CUR[c||'IQD']||'');
const iqd=v=>num(v,0);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),3200)}
async function api(path,opt){opt=opt||{};const r=await fetch(path,{method:opt.method||'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(TOKEN||'')},body:opt.body?JSON.stringify(opt.body):undefined});
  const j=await r.json().catch(()=>({}));if(r.status===401&&TOKEN){TOKEN=null;LS.del('token');showLogin('انتهت الجلسة — سجّل الدخول مجدداً');throw new Error('انتهت الجلسة')}
  if(!r.ok)throw new Error(j.message||('خطأ '+r.status));return j}
const post=(p,b)=>api(p,{method:'POST',body:b||{}});
function dlg(html){closeDlg();const o=document.createElement('div');o.className='ov';o.id='dlg';o.innerHTML=`<div class="dlg">${html}</div>`;o.addEventListener('mousedown',e=>{if(e.target===o)closeDlg()});document.body.appendChild(o);return o}
function closeDlg(){const o=$('#dlg');if(o)o.remove()}
function ask(title,label){return new Promise(res=>{dlg(`<h3>${esc(title)}</h3><label class="mut">${esc(label||'')}</label><textarea id="askT"></textarea><div class="row" style="margin-top:10px"><button class="btn pri" id="askY">تأكيد</button><button class="btn" id="askN">إلغاء</button></div>`);
  $('#askY').onclick=()=>{const v=$('#askT').value.trim();closeDlg();res(v||'—')};$('#askN').onclick=()=>{closeDlg();res(null)};$('#askT').focus()})}
const today=()=>M?M.today:new Date().toISOString().slice(0,10);
const set=k=>(M&&M.settings[k])||'';
const P=p=>{const ps=(M&&M.user.perms)||[];return ps.includes('*')||ps.includes(p)||(p.startsWith('reports.')&&ps.includes('reports'))};
const isAdmin=()=>M&&M.user.role==='admin';
/* القوائم */
const acc=c=>(M.accounts.find(a=>a.code===c)||{});
const accName=c=>c?c+' – '+(acc(c).name||''):'';
function accOpts(sel,filter,allowGroup){return M.accounts.filter(a=>a.active&&(allowGroup||!a.is_group)&&(!filter||filter(a))).map(a=>`<option value="${a.code}" ${a.code===String(sel||'')?'selected':''}>${'  '.repeat(Math.max(0,a.code.length-1))}${a.code} – ${esc(a.name)}</option>`).join('')}
function partyOpts(sel,kinds){return '<option value="">— اختر —</option>'+M.parties.filter(p=>(p.active||p.id==sel)&&(!kinds||kinds.includes(p.kind))).map(p=>`<option value="${p.id}" ${p.id==sel?'selected':''}>${esc(p.name)}${p.currency==='USD'?' ($)':''}</option>`).join('')}
function itemOpts(sel,stockOnly){return '<option value="">— بدون مادة (وصف حر) —</option>'+M.items.filter(i=>(i.active||i.id==sel)&&(!stockOnly||i.stock)).map(i=>`<option value="${i.id}" ${i.id==sel?'selected':''}>${esc(i.name)}${i.code?' ['+esc(i.code)+']':''}</option>`).join('')}
function projOpts(sel){return '<option value="">— بدون مشروع —</option>'+M.projects.filter(p=>p.active||p.id==sel).map(p=>`<option value="${p.id}" ${p.id==sel?'selected':''}>${esc(p.code)} – ${esc(p.name)}</option>`).join('')}
function whOpts(sel){return M.warehouses.filter(w=>w.active||w.id==sel).map(w=>`<option value="${w.id}" ${w.id==sel?'selected':''}>${esc(w.name)}</option>`).join('')}
const curOpts=c=>`<option value="IQD" ${c!=='USD'?'selected':''}>دينار عراقي</option><option value="USD" ${c==='USD'?'selected':''}>دولار أمريكي</option>`;
const KIND={manual:'قيد يدوي',opening:'قيد افتتاحي',sale:'مبيعات',purchase:'مشتريات',receipt:'سند قبض',payment:'سند صرف',stock:'مخزن'};
const PK={customer:'زبون',supplier:'مورد',both:'زبون ومورد',employee:'موظف / عهدة',other:'أخرى'};
const STK={opening:'رصيد افتتاحي',issue:'صرف لمشروع',return:'إرجاع من مشروع',adjust:'تسوية جرد',transfer:'تحويل بين مخازن'};
const QS={draft:['مسودة',''],sent:['مرسل للزبون','blue'],accepted:['موافق عليه','ok'],rejected:['مرفوض','bad'],invoiced:['محوّل لفاتورة','ok']};
const st=s=>s==='void'?'<span class="pill bad">ملغى</span>':'<span class="pill ok">مرحّل</span>';
function csv(rows,name){const t='﻿'+rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=name+'.csv';document.body.appendChild(a);a.click();a.remove()}
function tableCsv(name){const t=$('#view table');if(!t)return;csv([...t.rows].map(r=>[...r.cells].map(c=>c.innerText.trim())),name)}

/* التفقيط بالعربية */
function tafqeet(n,cur){n=Math.round((Number(n)||0)*100)/100;const ip=Math.floor(n),fp=Math.round((n-ip)*100);
  const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const hund=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  function u999(x){const h=Math.floor(x/100),r=x%100,p=[];if(h)p.push(hund[h]);if(r){if(r<20)p.push(ones[r]);else{const o=r%10,t=Math.floor(r/10);p.push(o?ones[o]+' و'+tens[t]:tens[t])}}return p.join(' و')}
  const scales=[['',''],['ألف','ألفان','آلاف'],['مليون','مليونان','ملايين'],['مليار','ملياران','مليارات']];
  function words(x){if(!x)return 'صفر';const parts=[];let i=0;while(x>0){const g=x%1000;if(g){let w;const s=scales[i];
      if(i===0)w=u999(g);else if(g===1)w=s[0];else if(g===2)w=s[1];else if(g<=10)w=u999(g)+' '+s[2];else w=u999(g)+' '+s[0];parts.unshift(w)}x=Math.floor(x/1000);i++}return parts.join(' و')}
  const main=cur==='USD'?'دولار أمريكي':'دينار عراقي',sub=cur==='USD'?'سنت':'فلس';
  return 'فقط '+words(ip)+' '+main+(fp?' و'+words(fp)+' '+sub:'')+' لا غير'}

/* ================= الدخول ================= */
async function boot(){let s;try{s=await api('/api/status')}catch(e){$('#auth').innerHTML='<div class="login"><div class="box"><h2>تعذّر الاتصال بالخادم</h2><p>'+esc(e.message)+'</p></div></div>';return}
  if(s.setup)return showSetup(s);if(!TOKEN)return showLogin();
  try{await loadMeta();start()}catch(e){if(TOKEN)showLogin(e.message)}}
function showSetup(){$('#app').classList.add('hidden');$('#auth').innerHTML=`<div class="login"><div class="box"><h2>إعداد برنامج الحسابات</h2><p class="mut">أنشئ حساب مدير النظام (مرة واحدة، من الحاسبة الأم).</p>
  <div class="f"><label>اسم المستخدم</label><input id="sU" value="admin" dir="ltr"></div><div class="f" style="margin-top:8px"><label>الاسم</label><input id="sN" value="مدير النظام"></div>
  <div class="f" style="margin-top:8px"><label>كلمة المرور (8 أحرف على الأقل)</label><input id="sP" type="password"></div><div class="f" style="margin-top:8px"><label>سعر صرف الدولار (دينار)</label><input id="sR" value="1310" inputmode="decimal" dir="ltr"></div>
  <p id="sM" class="hidden"></p><button class="btn pri" style="width:100%;justify-content:center;margin-top:12px" id="sB">إنشاء الحساب</button></div></div>`;
  $('#sB').onclick=async()=>{try{await post('/api/setup',{username:$('#sU').value,name:$('#sN').value,password:$('#sP').value,usd_rate:$('#sR').value});showLogin('تم الإعداد — سجّل الدخول',true)}catch(e){const m=$('#sM');m.className='warnbox';m.textContent=e.message}}}
function showLogin(msg,ok){$('#app').classList.add('hidden');$('#auth').innerHTML=`<div class="login"><div class="box"><h2>برنامج الحسابات</h2><p class="mut">الطاقة الوطنية للمقاولات والتجارة العامة والطاقة المتجددة</p>

const r2c=x=>Math.round(x*100)/100;
const TIERS={r:'مفرد',w:'جملة',a:'وكيل'};
function tierPrice(it,t){if(!it)return null;const v=t==='w'?it.price_wholesale:t==='a'?it.price_agent:it.sale_price;return v==null||v===''?null:Number(v)}
function linesEditor(lines,opt){opt=opt||{};const L=(lines&&lines.length?lines:[{}]).map(l=>Object.assign({qty:1},l));
  const html=`<div class="tw" style="max-height:none"><table class="lines" id="LT"><thead><tr><th style="width:26%">المادة</th><th>الوصف</th>${opt.account?'<th style="width:18%">الحساب (للخدمات)</th>':''}<th style="width:90px">الكمية</th><th style="width:96px">الوحدة</th><th style="width:150px">السعر</th><th style="width:130px" class="n">المجموع</th><th style="width:30px"></th></tr></thead><tbody></tbody></table></div>
   <button class="btn sm" style="margin-top:6px" id="addL">+ سطر</button>`;
  function row(l){const tr=document.createElement('tr');
    tr.innerHTML=`<td><select class="li">${itemOpts(l.item_id)}</select></td><td><input class="ld" value="${esc(l.description||'')}"></td>${opt.account?`<td><select class="la"><option value="">تلقائي</option>${accOpts(l.account_code,opt.account)}</select></td>`:''}
     <td><input class="lq" inputmode="decimal" dir="ltr" value="${l.pack_unit?l.pack_count:(l.qty||'')}"></td><td><select class="lu"></select></td><td>${opt.price?`<select class="lr" title="نوع السعر">${Object.entries(TIERS).map(([k,v])=>`<option value="${k}" ${(l.tier||(opt.tier&&opt.tier())||'r')===k?'selected':''}>${v}</option>`).join('')}</select>`:''}<input class="lp" inputmode="decimal" dir="ltr" value="${l.pack_unit?l.pack_price:(l.unit_price!=null?l.unit_price:'')}"></td><td class="n lt"></td><td><button class="del" title="حذف">×</button></td>`;
    const units=(pick)=>{const it=M.items.find(i=>i.id==tr.querySelector('.li').value);const u=tr.querySelector('.lu');
      u.innerHTML=`<option value="">${esc((it&&it.unit)||'—')}</option>`+(it&&it.pack_unit&&it.pack_qty>1?`<option value="p">${esc(it.pack_unit)} (${num(it.pack_qty)})</option>`:'');u.value=pick&&u.querySelector('option[value="p"]')?'p':'';u.disabled=u.options.length<2};
    units(!!l.pack_unit);
    // السعر من قائمة المواد حسب النوع المختار (مفرد/جملة/وكيل) والوحدة (قطعة/تعبئة)
    const fill=force=>{if(!opt.price)return;const it=M.items.find(i=>i.id==tr.querySelector('.li').value),p=tr.querySelector('.lp');const v=tierPrice(it,tr.querySelector('.lr').value);
      if(v!=null&&(force||!p.value))p.value=tr.querySelector('.lu').value==='p'?r2c(v*it.pack_qty):v;else if(v==null&&force&&it)toast('لا يوجد سعر '+TIERS[tr.querySelector('.lr').value]+' لهذه المادة في قائمة المواد')};
    tr.fillPrice=fill;
    tr.querySelector('.lu').onchange=()=>{fill(true);opt.onChange&&opt.onChange()};
    if(opt.price)tr.querySelector('.lr').onchange=()=>{fill(true);opt.onChange&&opt.onChange()};
    tr.querySelector('.li').onchange=e=>{const it=M.items.find(i=>i.id==e.target.value);units(false);if(it){if(!tr.querySelector('.ld').value||tr.querySelector('.ld').dataset.auto)tr.querySelector('.ld').value=it.name,tr.querySelector('.ld').dataset.auto=1;fill(true)}opt.onChange&&opt.onChange()};
    tr.querySelector('.del').onclick=()=>{tr.remove();opt.onChange&&opt.onChange()};
    tr.querySelectorAll('input').forEach(i=>i.oninput=()=>opt.onChange&&opt.onChange());return tr}
  return {setTier(t){$$('#LT tbody tr').forEach(tr=>{const r=tr.querySelector('.lr');if(r){r.value=t;tr.fillPrice&&tr.fillPrice(true)}});opt.onChange&&opt.onChange()},html,mount(){const tb=$('#LT tbody');L.forEach(l=>tb.appendChild(row(l)));$('#addL').onclick=()=>{tb.appendChild(row({qty:1}));opt.onChange&&opt.onChange()};opt.onChange&&opt.onChange()},
    read(){return $$('#LT tbody tr').map(tr=>{const q=Number(tr.querySelector('.lq').value)||0,p=Number(tr.querySelector('.lp').value)||0,pk=tr.querySelector('.lu').value==='p';
      return {tier:tr.querySelector('.lr')?tr.querySelector('.lr').value:undefined,item_id:tr.querySelector('.li').value||null,description:tr.querySelector('.ld').value,account_code:tr.querySelector('.la')?tr.querySelector('.la').value||null:null,qty:q,unit_price:p,pack_count:pk?q:null,pack_price:pk?p:null}})},
    totals(){let s=0;$$('#LT tbody tr').forEach(tr=>{const t=(Number(tr.querySelector('.lq').value)||0)*(Number(tr.querySelector('.lp').value)||0);s+=t;tr.querySelector('.lt').textContent=num(t)});return s}}}

  E.mount();$('#qTier').onchange=()=>E.setTier($('#qTier').value);$('#qD').oninput=()=>{const s=E.totals();$('#qT').textContent=num(s-(Number($('#qD').value)||0))};

/* محرّر ما قبل الطباعة: إخفاء الأعمدة والأجزاء، وتعديل النص، وحجم الخط واتجاه الورقة، ويتذكّر اختياراتك لكل نوع مستند */
const PE_OFF={project:1,due:1};
const PE_PARTS={head:'ترويسة الشركة',party:'بيانات الزبون / المورد',due:'تاريخ الاستحقاق',words:'المبلغ كتابةً',account:'الحساب',method:'طريقة الدفع',project:'المشروع',notes:'الملاحظات',terms:'الشروط والأحكام',sig:'التواقيع',foot:'تذييل الصفحة'};
function peGrid(t){const rows=[...t.rows],occ=[];let n=0;
  rows.forEach((tr,r)=>{let c=0;[...tr.cells].forEach(td=>{while(occ[r]&&occ[r][c])c++;
    if(td.dataset.cs==null)td.dataset.cs=td.colSpan||1;const sp=+td.dataset.cs,rs=td.rowSpan||1;td._c=c;td._s=sp;
    for(let k=0;k<rs;k++){occ[r+k]=occ[r+k]||[];for(let j=0;j<sp;j++)occ[r+k][c+j]=1}c+=sp});n=Math.max(n,c)});
  return n}
function peCols(t){const n=peGrid(t),hr=t.rows[0];if(!hr)return null;const cells=[...hr.cells];
  if(cells.length<3||cells.some(c=>c.tagName!=='TH')||cells.some(c=>c._s!==1)||cells.length!==n)return null;
  return cells.map((c,i)=>(c.textContent.trim()||('عمود '+(i+1))))}
function peApplyCols(t,hidden){peGrid(t);[...t.rows].forEach(tr=>{const cells=[...tr.cells];tr.querySelectorAll('.pe-mv').forEach(e=>e.remove());
  cells.forEach(td=>{let v=0;for(let j=0;j<td._s;j++)if(!hidden.has(td._c+j))v++;if(!v){td.style.display='none'}else{td.style.display='';td.colSpan=v}});
  /* صفوف المجاميع: إذا أُخفي عمود قيمتها تبقى القيمة ظاهرة على يسار السطر نفسه */
  const lab=cells.find(td=>td._s>1&&td.style.display!=='none');if(!lab)return;
  cells.forEach(td=>{if(td!==lab&&td._s===1&&td.style.display==='none'&&td.textContent.trim()){const m=document.createElement('span');m.className='pe-mv';m.innerHTML=td.innerHTML;lab.appendChild(m)}})})}
function openPrintEditor(html){document.getElementById('pe')?.remove();
  const o=document.createElement('div');o.id='pe';
  o.innerHTML=`<div class="pe-side"><h3>تعديل قبل الطباعة</h3><p class="pe-hint">اختر ما يظهر في الورقة. يمكنك أيضاً النقر على أي نص في الورقة وتعديله أو حذفه مباشرة.</p><div id="peCtl"></div>
   <h4>الورقة</h4><label>حجم الخط <select id="peFont" style="width:auto;margin-inline-start:auto">${[11,12,13,14,15,16].map(v=>`<option value="${v}">${v}</option>`).join('')}</select></label>
   <label>الاتجاه <select id="peOr" style="width:auto;margin-inline-start:auto"><option value="p">عمودي</option><option value="l">أفقي</option></select></label>
   <label><input type="checkbox" id="peRem" checked> تذكّر هذه الإعدادات لهذا النوع</label>
   <div class="pe-btns"><button class="btn pri" id="peGo">🖨 طباعة</button><button class="btn" id="peNote">+ ملاحظة</button><button class="btn" id="peReset">الوضع الأصلي</button><button class="btn" id="peX">إلغاء</button></div></div>
   <div class="pe-wrap"><div class="pe-page" id="peDoc" contenteditable="true" spellcheck="false"></div></div>`;
  document.body.appendChild(o);const D=$('#peDoc');D.innerHTML=html;
  D.querySelectorAll('.ph .co').forEach(e=>e.dataset.pe=e.dataset.pe||'head');D.querySelectorAll('.psig').forEach(e=>e.dataset.pe=e.dataset.pe||'sig');
  D.querySelectorAll('a,button,input,select').forEach(e=>{if(e.tagName==='A')e.removeAttribute('href');else if(e.tagName==='BUTTON')e.remove();else e.disabled=true});
  const kind=(D.querySelector('.ph .ti b')?.textContent||'مستند').trim(),key='pe.'+kind;
  const saved=LS.get(key,{}),tables=[...D.querySelectorAll('table')].map(t=>({t,cols:peCols(t)})).filter(x=>x.cols);
  const parts=[...new Set([...D.querySelectorAll('[data-pe]')].map(e=>e.dataset.pe))].filter(k=>PE_PARTS[k]);
  let h='';
  tables.forEach((x,i)=>{const hid=new Set((saved.cols||{})[i]||[]);h+=`<div class="pe-tbl"><b>${tables.length>1?'الجدول '+(i+1)+' – ':''}الأعمدة الظاهرة</b>${x.cols.map((c,j)=>`<label><input type="checkbox" data-t="${i}" data-c="${j}" ${hid.has(c)?'':'checked'}> ${esc(c)}</label>`).join('')}</div>`});
  if(parts.length)h+=`<h4>أجزاء المستند</h4>`+parts.map(k=>`<label><input type="checkbox" data-p="${k}" ${((saved.parts||{})[k]??!PE_OFF[k])?'checked':''}> ${PE_PARTS[k]}</label>`).join('');
  $('#peCtl').innerHTML=h;$('#peFont').value=saved.font||13;$('#peOr').value=saved.or||'p';
  const apply=()=>{tables.forEach((x,i)=>{const hid=new Set([...o.querySelectorAll(`input[data-t="${i}"]`)].filter(c=>!c.checked).map(c=>+c.dataset.c));peApplyCols(x.t,hid)});
    o.querySelectorAll('input[data-p]').forEach(c=>D.querySelectorAll(`[data-pe="${c.dataset.p}"]`).forEach(e=>e.style.display=c.checked?'':'none'));
    D.style.fontSize=$('#peFont').value+'px';D.classList.toggle('land',$('#peOr').value==='l')};
  o.querySelectorAll('#peCtl input,#peFont,#peOr').forEach(e=>e.onchange=apply);apply();
  const close=()=>{o.remove();document.removeEventListener('keydown',kd)},kd=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',kd);
  $('#peX').onclick=close;
  $('#peReset').onclick=()=>{LS.del(key);close();openPrintEditor(html)};
  $('#peNote').onclick=()=>{const p=document.createElement('p');p.textContent='اكتب ملاحظتك هنا';const at=D.querySelector('.psig')||D.querySelector('.pfoot');D.insertBefore(p,at);
    const r=document.createRange();r.selectNodeContents(p);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);p.focus?.()};
  $('#peGo').onclick=()=>{if($('#peRem').checked){const cols={};tables.forEach((x,i)=>{cols[i]=[...o.querySelectorAll(`input[data-t="${i}"]`)].filter(c=>!c.checked).map(c=>x.cols[+c.dataset.c])});
      const pp={};o.querySelectorAll('input[data-p]').forEach(c=>pp[c.dataset.p]=c.checked);LS.set(key,{cols,parts:pp,font:+$('#peFont').value,or:$('#peOr').value})}
    const P=$('#print');P.innerHTML=D.innerHTML;P.style.fontSize=D.style.fontSize;
    let st=document.getElementById('peSize');if(!st){st=document.createElement('style');st.id='peSize';document.head.appendChild(st)}
    st.textContent=`@media print{@page{size:A4 ${$('#peOr').value==='l'?'landscape':'portrait'};margin:12mm 10mm}}`;
    close();setTimeout(()=>window.print(),80)}}
function unitOf(l){const it=l.item_id&&M.items.find(x=>x.id==l.item_id);return (it&&it.unit)||''}
function qtyCells(l){if(l.pack_unit&&l.pack_count)return `<td>${num(l.pack_count)}<div style="font-size:11px;color:#555">= ${num(l.qty)} ${esc(unitOf(l)||'قطعة')}</div></td><td>${esc(l.pack_unit)}</td><td>${num(l.pack_price)}</td>`;return `<td>${num(l.qty)}</td><td>${esc(unitOf(l))}</td><td>${num(l.unit_price)}</td>`}
window.printInvoice=async id=>{const d=await api('/api/invoices/'+id);doPrint(letterhead(d.type==='sale'?'فاتورة بيع':'فاتورة شراء',d.no,d.date)+`<p data-pe="party">${d.type==='sale'?'السيد/السادة':'المورد'}: <b>${esc(d.party)}</b>${d.party_phone?' · '+esc(d.party_phone):''}${d.due_date?'<span data-pe="due"><br>تاريخ الاستحقاق: '+esc(d.due_date)+'</span>':''}${d.project?'<span data-pe="project"><br>المشروع: '+esc(d.project)+'</span>':''}${d.status==='void'?'<br><b style="color:#c00">ملغاة</b>':''}</p>
  <table class="pt"><tr><th class="w-no">#</th><th>البيان</th><th class="w-q">الكمية</th><th class="w-u">الوحدة</th><th class="w-p">السعر</th><th class="w-t">المجموع</th></tr>${d.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.description)}</td>${qtyCells(l)}<td>${num(l.total)}</td></tr>`).join('')}
  <tr><td colspan=5>المجموع</td><td>${num(d.subtotal)}</td></tr>${d.discount?`<tr><td colspan=5>الخصم</td><td>${num(d.discount)}</td></tr>`:''}${d.tax?`<tr><td colspan=5>ضريبة/رسوم</td><td>${num(d.tax)}</td></tr>`:''}<tr><th colspan=5>الإجمالي</th><th>${money(d.total,d.currency)}</th></tr></table>
  <p data-pe="words"><b>${esc(tafqeet(d.total,d.currency))}</b></p>${d.notes?`<p data-pe="notes">ملاحظات: ${esc(d.notes)}</p>`:''}${set('invoice_terms')?`<p data-pe="terms" style="white-space:pre-line">${esc(set('invoice_terms'))}</p>`:''}<div class="psig"><div>المحاسب</div><div>المستلم</div><div>المدير</div></div>`)};
window.printQuote=async id=>{const q=await api('/api/quotations/'+id);doPrint(letterhead('عرض سعر',q.no,q.date)+`<p data-pe="party">السيد/السادة: <b>${esc(q.party||q.customer_name||'')}</b>${q.customer_phone||q.party_phone?' · '+esc(q.customer_phone||q.party_phone):''}${q.valid_until?'<br>العرض صالح لغاية: '+q.valid_until:''}</p>
  <table class="pt"><tr><th class="w-no">#</th><th>البيان</th><th class="w-q">الكمية</th><th class="w-u">الوحدة</th><th class="w-p">السعر</th><th class="w-t">المجموع</th></tr>${q.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.description)}</td>${qtyCells(l)}<td>${num(l.total)}</td></tr>`).join('')}
  ${q.discount?`<tr><td colspan=5>الخصم</td><td>${num(q.discount)}</td></tr>`:''}<tr><th colspan=5>الإجمالي</th><th>${money(q.total,q.currency)}</th></tr></table><p data-pe="words"><b>${esc(tafqeet(q.total,q.currency))}</b></p>${q.terms?`<p data-pe="terms" style="white-space:pre-line">${esc(q.terms)}</p>`:''}<div class="psig"><div>قسم المبيعات</div><div></div><div>المدير</div></div>`)};
window.printVoucher=async id=>{const v=await api('/api/vouchers/'+id);doPrint(letterhead(v.type==='receipt'?'سند قبض':'سند صرف',v.no,v.date)+`<table class="pt"><tr><th style="width:30%">المبلغ</th><td style="font-size:17px"><b>${money(v.amount,v.currency)}</b></td></tr><tr data-pe="words"><th>المبلغ كتابةً</th><td>${esc(tafqeet(v.amount,v.currency))}</td></tr>
  <tr><th>${v.type==='receipt'?'استلمنا من':'صُرف إلى'}</th><td>${esc(v.payee||v.party||'')}</td></tr><tr><th>وذلك عن</th><td>${esc(v.memo||'')}</td></tr><tr data-pe="account"><th>الحساب</th><td>${esc(accName(v.counter_account))}</td></tr><tr data-pe="method"><th>طريقة الدفع</th><td>${{cash:'نقداً',cheque:'صك',transfer:'حوالة مصرفية'}[v.method]||''} ${esc(v.cheque_no||'')} — ${esc(accName(v.cash_account))}</td></tr>${v.project?`<tr data-pe="project"><th>المشروع</th><td>${esc(v.project)}</td></tr>`:''}${v.status==='void'?'<tr><th>الحالة</th><td style="color:#c00">ملغى</td></tr>':''}</table>
  <div class="psig"><div>المحاسب</div><div>${v.type==='receipt'?'أمين الصندوق':'المستلم'}</div><div>المدير</div></div>`)};
window.printStock=async id=>{const d=await api('/api/stock/'+id);doPrint(letterhead(STK[d.type],d.no,d.date)+`<p>المخزن: ${esc(d.warehouse||'')}${d.to_warehouse?' ← '+esc(d.to_warehouse):''}${d.project?'<span data-pe="project"> · المشروع: '+esc(d.project)+'</span>':''}<br>${esc(d.memo||'')}</p><table class="pt"><tr><th>#</th><th>المادة</th><th>الكمية</th><th>الوحدة</th></tr>${d.lines.filter(l=>!(d.type==='transfer'&&l.qty>0)).map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.item)}</td><td>${num(Math.abs(l.qty))}</td><td>${esc(l.unit||'')}</td></tr>`).join('')}</table><div class="psig"><div>أمين المخزن</div><div>المستلم</div><div>المدير</div></div>`)};
window.addEventListener('afterprint',()=>{$('#print').innerHTML=''});

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
